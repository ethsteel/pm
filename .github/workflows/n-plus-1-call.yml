name: N+1 Call Issue

on:
  schedule:
    # Friday 16:00 UTC — after the 14:00 UTC call: close this week's, open next week's
    - cron: "0 16 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rotate:
    uses: ./.github/workflows/rotate-call-issue.yml
    with:
      search-title: N+1 Call
      close-comment: Closed automatically after the N+1 call.
      days: friday
      title-template: "N+1 Call, Friday {date1} {year}"
      template-file: n-plus-1-call.md
