name: Weekly Meeting Issue

on:
  schedule:
    # Wednesday 18:00 UTC — after the call: close this week's, open next week's
    - cron: "0 18 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rotate:
    uses: ./.github/workflows/rotate-call-issue.yml
    with:
      search-title: SPECS Weekly Meeting
      close-comment: Closed automatically after the weekly call.
      days: wednesday
      title-template: "SPECS Weekly Meeting, Wed {date1}, {year}"
      template-file: specs-weekly-meeting.md
