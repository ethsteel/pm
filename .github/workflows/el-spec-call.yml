name: EL Specs Call Issue

on:
  schedule:
    # Thursday 17:00 UTC = 5pm UK in winter (6pm in summer) — after Thursday's
    # call: close this week's issue (Tue & Thu), open next week's
    - cron: "0 17 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rotate:
    uses: ./.github/workflows/rotate-call-issue.yml
    with:
      search-title: EL Specs Call
      close-comment: Closed automatically after Thursday's EL Specs call.
      days: tuesday thursday
      title-template: "EL Specs Call, Tue {date1} & Thu {date2}, {year}"
      template-file: el-spec-call.md
